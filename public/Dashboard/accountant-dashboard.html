<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accountant Dashboard - HMS</title>
    <link rel="stylesheet" href="../assets/css/dashboard-common.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="accountant-theme">
    <!-- Header -->
    <header class="header">
        <div class="header-content">
            <div class="logo">
                <h1><i class="fas fa-calculator"></i> HMS - Accounting</h1>
            </div>
            <div class="user-info">
                <div class="user-avatar">AC</div>
                <div>
                    <div style="font-weight: 600;">Michael Rodriguez</div>
                    <div style="font-size: 0.9rem; opacity: 0.8;">Senior Accountant</div>
                </div>
                <button class="logout-btn">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </button>
            </div>
        </div>
    </header>

    <div class="main-container">
        <!-- Sidebar -->
        <nav class="sidebar">
            <ul class="nav-menu">
                <li class="nav-item">
                    <a href="#dashboard" class="nav-link active">
                        <i class="fas fa-tachometer-alt nav-icon"></i>
                        Dashboard
                    </a>
                </li>
                <li class="nav-item">
                    <a href="#billing" class="nav-link">
                        <i class="fas fa-file-invoice nav-icon"></i>
                        Patient Billing
                    </a>
                </li>
                <li class="nav-item">
                    <a href="#payments" class="nav-link">
                        <i class="fas fa-credit-card nav-icon"></i>
                        Payment Processing
                    </a>
                </li>
                <li class="nav-item">
                    <a href="#insurance" class="nav-link">
                        <i class="fas fa-shield-alt nav-icon"></i>
                        Insurance Claims
                    </a>
                </li>
                <li class="nav-item">
                    <a href="#accounts-receivable" class="nav-link">
                        <i class="fas fa-money-bill-wave nav-icon"></i>
                        Accounts Receivable
                    </a>
                </li>
                <li class="nav-item">
                    <a href="#financial-reports" class="nav-link">
                        <i class="fas fa-chart-line nav-icon"></i>
                        Financial Reports
                    </a>
                </li>
                <li class="nav-item">
                    <a href="#collections" class="nav-link">
                        <i class="fas fa-phone nav-icon"></i>
                        Collections
                    </a>
                </li>
            </ul>
        </nav>
