<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pharmacist Dashboard - HMS</title>
    <link rel="stylesheet" href="../assets/css/dashboard-common.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="pharmacy-theme">
    <!-- Header -->
    <header class="header">
        <div class="header-content">
            <div class="logo">
                <h1><i class="fas fa-pills"></i> HMS - Pharmacy</h1>
            </div>
            <div class="user-info">
                <div class="user-avatar">PH</div>
                <div>
                    <div style="font-weight: 600;">Dr. Rachel Thompson</div>
                    <div style="font-size: 0.9rem; opacity: 0.8;">Clinical Pharmacist</div>
                </div>
                <button class="logout-btn">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </button>
            </div>
        </div>
    </header>
    <div class="main-container">
        <!-- Sidebar -->
        <nav class="sidebar">
            <ul class="nav-menu">
                <li class="nav-item">
                    <a href="#dashboard" class="nav-link active">
                        <i class="fas fa-tachometer-alt nav-icon"></i>
                        Dashboard
                    </a>
                </li>
                <li class="nav-item">
                    <a href="#prescriptions" class="nav-link">
                        <i class="fas fa-prescription nav-icon"></i>
                        Prescription Queue
                    </a>
                </li>
                <li class="nav-item">
                    <a href="#inventory" class="nav-link">
                        <i class="fas fa-boxes nav-icon"></i>
                        Inventory Management
                    </a>
                </li>
                <li class="nav-item">
                    <a href="#dispensing" class="nav-link">
                        <i class="fas fa-hand-holding-medical nav-icon"></i>
                        Medication Dispensing
                    </a>
                </li>
                <li class="nav-item">
                    <a href="#drug-interactions" class="nav-link">
                        <i class="fas fa-exclamation-triangle nav-icon"></i>
                        Drug Interactions
                    </a>
                </li>
                <li class="nav-item">
                    <a href="#controlled-substances" class="nav-link">
                        <i class="fas fa-lock nav-icon"></i>
                        Controlled Substances
                    </a>
                </li>
                <li class="nav-item">
                    <a href="#reports" class="nav-link">
                        <i class="fas fa-chart-bar nav-icon"></i>
                        Pharmacy Reports
                    </a>
                </li>
            </ul>
        </nav>
